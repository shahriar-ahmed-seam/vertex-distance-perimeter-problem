<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive mathematical laboratory & solver engine for the Vertex-Distance Perimeter Problem." />
    <title>The Vertex-Distance Perimeter Theorem | Interactive Laboratory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/animations.css" />
  </head>
  <body>
    <div id="app" class="app-layout">
      <!-- Header Navigation -->
      <header class="app-header">
        <div class="header-brand">
          <div class="brand-icon">🔺</div>
          <div class="brand-text">
            <h1 class="brand-title">triangle-thm</h1>
            <span class="brand-badge">RESEARCH LAB</span>
          </div>
        </div>

        <nav class="nav-tabs" id="nav-tabs">
          <button class="nav-tab active" data-tab="sandbox" id="tab-btn-sandbox">
            <span class="tab-icon">🎮</span> Interactive Sandbox
          </button>
          <button class="nav-tab" data-tab="inverse" id="tab-btn-inverse">
            <span class="tab-icon">🔄</span> Inverse Manifold
          </button>
          <button class="nav-tab" data-tab="benchmark" id="tab-btn-benchmark">
            <span class="tab-icon">⚡</span> Solver Benchmark
          </button>
          <button class="nav-tab" data-tab="landscape" id="tab-btn-landscape">
            <span class="tab-icon">📊</span> Error Landscape
          </button>
          <button class="nav-tab" data-tab="theory" id="tab-btn-theory">
            <span class="tab-icon">📖</span> Theory & Proofs
          </button>
        </nav>

        <div class="header-actions">
          <div class="stat-pill" title="Engine Status">
            <span class="status-dot pulse"></span>
            <span class="status-text" id="status-label">4 Engines Ready</span>
          </div>
        </div>
      </header>

      <!-- Main Content Container -->
      <main class="app-main" id="main-content">
        <!-- Content will be dynamically rendered by tab router -->
      </main>

      <!-- Footer -->
      <footer class="app-footer">
        <div class="footer-left">
          <span>The Vertex-Distance Perimeter Problem</span> &bull;
          <span>3 Distances &bull; Infinite Triangles &bull; One Deep Truth</span>
        </div>
        <div class="footer-right">
          <span>Python &bull; Go &bull; TypeScript &bull; Rust-WASM</span>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
