[package]
name = "triangle-thm-wasm"
version = "1.0.0"
edition = "2021"
authors = ["Shahriar"]
description = "High-performance WebAssembly solvers for the Vertex-Distance Perimeter Problem"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
